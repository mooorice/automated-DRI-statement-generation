# AutoConcourse config: Swiss food policy
# Based on the Validation pipeline from the thesis

topic:
  name: "Future of Switzerland's food system"
  id: "food_policy_ch"
  languages: ["de", "fr", "it"]

corpus:
  source: "csv"
  path: "data/food_policy_ch/corpus/paragraphs.csv"
  text_column: "text"
  metadata_columns: ["medium_code", "language", "id"]
  chunking:
    method: "paragraph"
    min_length: 20
  filtering:
    keywords_file: "data/food_policy_ch/keywords.json"
    require_keyword: true

anchors:
  method: "llm_generated"
  subcategories_file: "data/food_policy_ch/subcategories.json"
  context_document: "data/food_policy_ch/anchor_background.pdf"
  languages: ["de", "fr", "it"]
  model: "openai/gpt-4o"
  anchors_per_subcategory: 3

embedding:
  model: "paraphrase-multilingual-MiniLM-L12-v2"
  batch_size: 32
  device: "cpu"

reduction:
  method: "umap"
  n_components: 50
  umap_params:
    n_neighbors: 30
    min_dist: 0.0
    metric: "cosine"

retrieval:
  method: "anchor_cosine"
  top_k: 500

perspective_groups:
  enabled: false

generation:
  model: "openai/gpt-4o"
  statements_per_group_per_subcategory: 5
  output_language: "en"
  prompt_template: "default"
  temperature: 0.7

evaluation:
  reference_file: "data/food_policy_ch/reference_concourse.json"
  coverage_thresholds: [0.7, 0.8, 0.9]
