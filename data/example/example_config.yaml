# Example AutoConcourse config — copy and adapt for your topic
# See configs/schema.yaml for all available options

topic:
  name: "Climate change policy"
  id: "climate_example"
  languages: ["en"]

corpus:
  source: "csv"
  path: "data/climate_example/corpus/paragraphs.csv"
  text_column: "text"
  metadata_columns: ["source", "language", "id"]
  chunking:
    method: "paragraph"
    min_length: 20
  filtering:
    keywords_file: "data/climate_example/keywords.json"
    require_keyword: true

anchors:
  method: "llm_generated"
  subcategories_file: "data/climate_example/subcategories.json"
  context_document: null
  languages: ["en"]
  model: "openai/gpt-4o"
  anchors_per_subcategory: 3

embedding:
  model: "paraphrase-multilingual-MiniLM-L12-v2"
  batch_size: 32
  device: "cpu"

reduction:
  method: "none"
  n_components: 50

retrieval:
  method: "anchor_cosine"
  top_k: 500

perspective_groups:
  enabled: false

generation:
  model: "openai/gpt-4o"
  statements_per_group_per_subcategory: 5
  output_language: "en"
  prompt_template: "default"
  temperature: 0.7

evaluation:
  reference_file: "data/climate_example/reference_concourse.json"
  coverage_thresholds: [0.7, 0.8, 0.9]
